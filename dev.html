<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEV CONTROL | RAYYSTORE</title>
    <style>
        :root { 
            --accent: #00d2ff; 
            --bg: #05070a; 
            --card: #0d121b; 
            --red: #ff4757; 
            --green: #2ed573; 
            --yellow: #f1c40f; 
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: #fff; padding: 15px; overflow-x: hidden; }

        /* LOADER LOGO R SMOOTH */
        #loader { position:fixed; inset:0; background:var(--bg); z-index:10000; display:flex; align-items:center; justify-content:center; transition: 0.8s; }
        .logo-r-load { font-size: 80px; font-weight: 900; color: var(--accent); text-shadow: 0 0 30px var(--accent); animation: pulse-load 1.5s infinite ease-in-out; }
        @keyframes pulse-load { 0%, 100% { opacity: 0.5; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } }

        .logo-main { font-size: 50px; font-weight: 900; color: var(--accent); text-shadow: 0 0 20px var(--accent); animation: pulse-load 2s infinite; text-align:center; display:block; margin: 10px 0; }

        /* LOGIN SCREEN */
        #login-dev { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-card { background: var(--card); padding: 35px; border-radius: 25px; border: 1px solid #1f2937; width: 95%; max-width: 380px; text-align: center; border-top: 5px solid var(--accent); box-shadow: 0 20px 50px rgba(0,0,0,0.7); }
        input { width: 100%; padding: 14px; margin: 10px 0; background: #161d29; border: 1px solid #1f2937; color: #fff; border-radius: 12px; outline: none; font-size: 1rem; transition: 0.3s; }
        input:focus { border-color: var(--accent); }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; font-size: 1rem; text-transform: uppercase; }
        .btn-accent { background: var(--accent); color: #000; }
        .btn-accent:hover { transform: scale(1.02); box-shadow: 0 0 20px var(--accent); }

        /* DASHBOARD GRID */
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 800px; margin: auto; padding-bottom: 50px; }
        .box { background: var(--card); padding: 25px; border-radius: 22px; border: 1px solid #1f2937; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
        h3 { font-size: 0.85rem; color: var(--accent); margin-bottom: 20px; border-bottom: 1px solid #1f2937; padding-bottom: 12px; text-transform: uppercase; letter-spacing: 2px; font-weight: 900; }
        
        .admin-item { background: #161d29; padding: 18px; border-radius: 15px; margin-bottom: 12px; border: 1px solid #1f2937; }
        .admin-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .admin-actions { display: flex; gap: 10px; }
        .btn-sm { flex: 1; padding: 10px; font-size: 0.75rem; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; text-transform: uppercase; }

        #notif { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #000; padding: 15px 30px; border-radius: 15px; font-weight: bold; z-index: 10001; transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 10px 30px rgba(0,210,255,0.4); }
        #notif.show { top: 30px; }

        #current-status { font-size: 1.5rem; margin: 15px 0; letter-spacing: 2px; }
    </style>
</head>
<body>

<div id="loader"><div class="logo-r-load">R</div></div>
<div id="notif">Pesan Notifikasi</div>

<div id="login-dev">
    <div class="login-card">
        <div class="logo-main">R</div>
        <h3 style="border:none; margin-bottom: 10px;">MASTER DEV ACCESS</h3>
        <p style="color:#8b949e; font-size: 0.8rem; margin-bottom: 20px;">Masukkan Key Rahasia untuk Kontrol Server</p>
        <input type="text" id="dev-user" placeholder="Username Dev">
        <input type="password" id="dev-pass" placeholder="Secret Key (085794)">
        <button class="btn btn-accent" onclick="devLogin()">UNLOCК MASTER PANEL</button>
    </div>
</div>

<div id="dev-panel" style="display:none;">
    <div class="logo-main">R</div>
    <h2 style="text-align:center; margin-bottom:30px; letter-spacing: 4px; font-weight: 900;">DEV <span style="color:var(--accent)">PANEL</span></h2>

    <div class="grid">
        <div class="box">
            <h3>⚡ Server Lock Control</h3>
            <p style="color:#8b949e; font-size: 0.8rem;">Kontrol akses toko secara Real-time</p>
            <div id="current-status" style="text-align:center; font-weight:bold;">MEMUAT...</div>
            <div style="display:flex; gap:10px;">
                <button class="btn" style="background:var(--green); color:#000; flex:1;" onclick="setServer('ON')">BUKA TOKO</button>
                <button class="btn" style="background:var(--red); color:#fff; flex:1;" onclick="setServer('OFF')">TUTUP TOKO</button>
            </div>
        </div>

        <div class="box">
            <h3>👥 Buat Akun Admin</h3>
            <input type="text" id="new-admin-user" placeholder="Username Admin Baru">
            <input type="password" id="new-admin-pass" placeholder="Password Admin Baru">
            <button class="btn btn-accent" onclick="addAdmin()">DAFTARKAN ADMIN</button>
        </div>

        <div class="box">
            <h3>Manajemen Data Admin</h3>
            <div id="admin-list" style="max-height: 300px; overflow-y: auto; padding-right: 5px;">
                Memuat data admin...
            </div>
        </div>

        <div class="box" style="border: 2px solid var(--red);">
            <h3 style="color:var(--red); border-color: var(--red);">⚠️ Danger Zone</h3>
            <p style="color:#8b949e; font-size: 0.75rem; margin-bottom: 15px;">Aksi di bawah ini tidak dapat dibatalkan.</p>
            <button class="btn" style="background:transparent; color:var(--red); border:1px solid var(--red)" onclick="clearTrx()">HAPUS SEMUA RIWAYAT TRANSAKSI</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    
    // Inisialisasi Firebase
    const firebaseConfig = { databaseURL: "https://rayy-all-web-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Hilangkan Loader
    window.addEventListener('load', () => {
        setTimeout(() => { 
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 800);
        }, 1500);
    });

    // Notifikasi Slide
    function showNotif(txt) {
        const n = document.getElementById('notif');
        n.innerText = txt;
        n.classList.add('show');
        setTimeout(() => n.classList.remove('show'), 3000);
    }

    // Login Dev Master
    window.devLogin = () => {
        const u = document.getElementById('dev-user').value;
        const p = document.getElementById('dev-pass').value;
        // Ganti 'rayy_dev' & '085794' kalau mau beda
        if(u === "rayy_dev" && p === "085794") {
            document.getElementById('login-dev').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('login-dev').style.display = 'none';
                document.getElementById('dev-panel').style.display = 'block';
                showNotif("🔓 Akses Master Diterima!");
            }, 500);
        } else {
            showNotif("❌ Key Master Salah!");
        }
    };

    // Monitor Status Server (Real-time)
    onValue(ref(db, 'server_status'), (snap) => {
        const status = snap.val() || "ON";
        const el = document.getElementById('current-status');
        el.innerText = status === "ON" ? "STATUS: ONLINE" : "STATUS: OFFLINE";
        el.style.color = status === "ON" ? "var(--green)" : "var(--red)";
        el.style.textShadow = status === "ON" ? "0 0 15px var(--green)" : "0 0 15px var(--red)";
    });

    // Ganti Status Server
    window.setServer = (val) => {
        set(ref(db, 'server_status'), val).then(() => {
            showNotif("✅ Server Berhasil di-" + val);
        });
    };

    // Tambah Admin ke Database
    window.addAdmin = () => {
        const user = document.getElementById('new-admin-user').value.trim();
        const pass = document.getElementById('new-admin-pass').value.trim();
        if(!user || !pass) return showNotif("⚠️ Isi Username & Password!");
        
        set(ref(db, 'admins/' + user), {
            username: user,
            password: pass,
            status: "Active",
            createdAt: new Date().toLocaleString()
        }).then(() => {
            showNotif("✅ Admin " + user + " Aktif!");
            document.getElementById('new-admin-user').value = "";
            document.getElementById('new-admin-pass').value = "";
        });
    };

    // Monitor List Admin (Real-time)
    onValue(ref(db, 'admins'), (snap) => {
        const list = document.getElementById('admin-list');
        list.innerHTML = "";
        if(!snap.exists()) {
            list.innerHTML = "<p style='text-align:center; color:#555;'>Tidak ada data admin.</p>";
            return;
        }
        snap.forEach(child => {
            const data = child.val();
            const isBanned = data.status === "Banned";
            list.innerHTML += `
                <div class="admin-item">
                    <div class="admin-info">
                        <span><b>${data.username}</b></span>
                        <span style="color:${isBanned ? 'var(--red)' : 'var(--green)'}; font-size:0.75rem; font-weight:bold;">
                            ● ${data.status}
                        </span>
                    </div>
                    <div class="admin-actions">
                        <button class="btn-sm" style="background:var(--yellow); color:#000;" onclick="toggleBan('${data.username}', '${data.status}')">
                            ${isBanned ? 'UNBAN' : 'BAN'}
                        </button>
                        <button class="btn-sm" style="background:var(--red); color:#fff;" onclick="delAdmin('${data.username}')">
                            HAPUS
                        </button>
                    </div>
                </div>
            `;
        });
    });

    // Ban / Unban Admin
    window.toggleBan = (user, currentStatus) => {
        const nextStatus = currentStatus === "Active" ? "Banned" : "Active";
        update(ref(db, 'admins/' + user), { status: nextStatus }).then(() => {
            showNotif("Status " + user + " Diperbarui!");
        });
    };

    // Hapus Admin
    window.delAdmin = (user) => {
        if(confirm("Hapus permanen akun admin: " + user + "?")) {
            remove(ref(db, 'admins/' + user)).then(() => showNotif("🗑️ Admin Dihapus!"));
        }
    };

    // Hapus Semua Transaksi
    window.clearTrx = () => {
        if(confirm("PERINGATAN! Semua riwayat transaksi akan dihapus dari database. Lanjutkan?")) {
            remove(ref(db, 'transactions')).then(() => showNotif("🗑️ Semua Transaksi Dihapus!"));
        }
    };
</script>
</body>
</html>
