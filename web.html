<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAYY STORE - OFFICIAL</title>
    <style>
        :root { --bg-main: #0a0c18; --bg-card: #161b2e; --accent-green: #39FF14; --accent-blue: #4F80FF; }
        body { font-family: sans-serif; background: var(--bg-main); color: #fff; margin: 0; padding-bottom: 100px; }
        header { padding: 40px; text-align: center; font-weight: 900; font-size: 2em; color: var(--accent-green); }
        .container { width: 90%; max-width: 500px; margin: 0 auto; }
        .category-btn { width: 100%; background: var(--bg-card); border: 1px solid #232a45; padding: 18px; border-radius: 15px; color: #fff; margin-bottom: 10px; cursor: pointer; text-align: left; }
        .product-list { display: none; background: #0f1221; padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        .option-item { background: white; color: black; padding: 12px; border-radius: 10px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; font-weight: bold; }
        .selected { border: 3px solid var(--accent-blue); background: #e0eaff; }
        .btn-add { width: 100%; padding: 15px; background: #ff9800; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; }
        #offline-screen { display:none; position:fixed; inset:0; background:#000; z-index:10000; flex-direction:column; align-items:center; justify-content:center; }
    </style>
</head>
<body>

<div id="offline-screen">
    <h1 style="color:red">SERVER MAINTENANCE</h1>
    <p>Silakan kembali nanti saat toko sudah buka.</p>
</div>

<header>RAYY STORE</header>
<div class="container">
    <button class="category-btn" onclick="toggleMenu('menu_script')">🤖 SCRIPT PREMIUM</button>
    <div id="menu_script" class="product-list">
        <div class="option-item" onclick="select(this, 'VAIREZYNE FREE', 50000)">VAIREZYNE FREE UP <span>Rp 50k</span></div>
        <div class="option-item" onclick="select(this, 'ALICE V16', 80000)">ALICE V16 <span>Rp 80k</span></div>
        <button class="btn-add" onclick="addToCart('menu_script')">+ Keranjang</button>
    </div>
    <button class="category-btn" onclick="toggleMenu('menu_apk')">💥 APK BUG EREN</button>
    <div id="menu_apk" class="product-list">
        <div class="option-item" onclick="select(this, 'APK 1H', 5000)">APK BUG 1 HARI <span>Rp 5k</span></div>
        <div class="option-item" onclick="select(this, 'APK PERM', 60000)">APK BUG PERMANEN <span>Rp 60k</span></div>
        <button class="btn-add" onclick="addToCart('menu_apk')">+ Keranjang</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<script>
    firebase.initializeApp({ databaseURL: "https://rayy-all-web-default-rtdb.asia-southeast1.firebasedatabase.app/" });
    const db = firebase.database();

    db.ref('server_status').on('value', (snap) => {
        document.getElementById('offline-screen').style.display = snap.val() === "OFF" ? "flex" : "none";
    });

    let selected = {};
    function toggleMenu(id) { 
        let m = document.getElementById(id); 
        m.style.display = m.style.display === 'block' ? 'none' : 'block'; 
    }
    function select(el, name, price) {
        el.parentElement.querySelectorAll('.option-item').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected');
        selected[el.parentElement.id] = { name, price };
    }
    function addToCart(id) {
        if(!selected[id]) return alert("Pilih produk!");
        let total = selected[id].price;
        window.location.href = "index.html?amount=" + total;
    }
</script>
</body>
</html>
