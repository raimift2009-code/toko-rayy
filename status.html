<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE STATUS | RAYYSTORE</title>
    <style>
        :root { --accent: #00d2ff; --bg: #05070a; --card: #0d121b; --green: #2ecc71; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: #fff; padding: 20px; text-align: center; }

        .logo-r { font-size: 60px; font-weight: 900; color: var(--accent); text-shadow: 0 0 20px var(--accent); animation: smoothPulse 2s infinite ease-in-out; margin-bottom: 10px; }
        @keyframes smoothPulse { 0%, 100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 40px var(--accent); } }

        .container { max-width: 500px; margin: 0 auto; }
        .status-header { margin-bottom: 30px; }
        .status-header h2 { letter-spacing: 3px; font-weight: 900; }

        .live-card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid #1f2937; text-align: left; position: relative; animation: slideIn 0.5s ease-out; }
        @keyframes slideIn { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }

        .live-id { font-size: 0.75rem; color: var(--accent); font-weight: bold; }
        .live-amt { font-size: 1.3rem; font-weight: 800; margin: 5px 0; }
        .live-status { position: absolute; bottom: 20px; right: 20px; font-weight: bold; font-size: 0.85rem; }
        
        .badge-pending { color: #f1c40f; }
        .badge-success { color: #2ecc71; text-shadow: 0 0 10px rgba(46, 204, 113, 0.4); }

        #empty-msg { color: #555; margin-top: 50px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <div class="status-header">
        <div class="logo-r">R</div>
        <h2>LIVE <span style="color:var(--accent)">STATUS</span></h2>
        <p style="color:#8b949e; font-size: 0.8rem;">Update Transaksi Secara Real-time</p>
    </div>

    <div id="live-list">Memuat data...</div>
    <div id="empty-msg" style="display:none;">Belum ada transaksi masuk hari ini.</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    
    const db = getDatabase(initializeApp({ databaseURL: "https://rayy-all-web-default-rtdb.asia-southeast1.firebasedatabase.app/" }));

    onValue(ref(db, 'transactions'), (snap) => {
        const container = document.getElementById('live-list');
        const empty = document.getElementById('empty-msg');
        container.innerHTML = "";
        
        if(!snap.exists()) {
            empty.style.display = "block";
            container.innerHTML = "";
            return;
        }
        
        empty.style.display = "none";
        snap.forEach(child => {
            const d = child.val();
            const isDone = d.status === "Sukses";
            container.innerHTML = `
                <div class="live-card">
                    <div class="live-id">${d.orderId}</div>
                    <div class="live-amt">${d.amount}</div>
                    <div style="font-size:0.8rem; color:#8b949e;">Pembeli: ${d.buyer.substring(0,3)}***</div>
                    <div class="live-status ${isDone ? 'badge-success' : 'badge-pending'}">
                        ${isDone ? '● SELESAI' : '⏳ PROSES'}
                    </div>
                </div>
            ` + container.innerHTML;
        });
    });
</script>
</body>
</html>
