<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAYMENT | RAYYSTORE</title>
    <style>
        :root { --accent: #00d2ff; --bg: #05070a; --card: #0d121b; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; margin:0; display:flex; align-items:center; justify-content:center; min-height: 100vh; }
        
        #offline-screen { display:none; position:fixed; inset:0; background:#000; z-index:10000; flex-direction:column; align-items:center; justify-content:center; }
        
        .logo-main { 
            font-size: 70px; font-weight: 900; color: var(--accent); 
            text-shadow: 0 0 20px var(--accent); animation: smoothPulse 2s infinite ease-in-out; 
            margin-bottom: 20px; 
        }
        @keyframes smoothPulse { 
            0%, 100% { transform: scale(1); filter: brightness(1); } 
            50% { transform: scale(1.1); filter: brightness(1.3); text-shadow: 0 0 40px var(--accent); } 
        }

        .card { 
            background: var(--card); border: 1px solid #1f2937; padding: 45px; 
            border-radius: 35px; width: 90%; max-width: 400px; text-align: center; 
            border-top: 6px solid var(--accent); box-shadow: 0 20px 50px rgba(0,0,0,0.8); 
        }
        
        input { 
            width: 100%; padding: 18px; margin-bottom: 15px; background: #161d29; 
            border: 1px solid #1f2937; color: #fff; border-radius: 15px; outline: none; 
            font-size: 1em; transition: 0.3s; box-sizing: border-box;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0,210,255,0.2); }
        
        .btn-pay { 
            width: 100%; padding: 20px; background: var(--accent); color: #000; 
            border: none; border-radius: 15px; font-weight: 900; cursor: pointer; 
            font-size: 1.1em; transition: 0.3s; margin-top: 10px;
        }
        .btn-pay:hover { transform: scale(1.03); box-shadow: 0 0 20px var(--accent); }
    </style>
</head>
<body>
<div id="offline-screen"><h1 style="color:red">SERVER OFFLINE</h1></div>

<div class="card">
    <div class="logo-main">R</div>
    <h2 style="margin-bottom: 25px; letter-spacing: 2px;">CHECKOUT</h2>
    <input type="text" id="buyer-name" placeholder="Nama / ID Game">
    <input type="number" id="amount" placeholder="Nominal Rp">
    <button class="btn-pay" onclick="handlePay()">PROSES PEMBAYARAN</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    
    const db = getDatabase(initializeApp({ databaseURL: "https://rayy-all-web-default-rtdb.asia-southeast1.firebasedatabase.app/" }));

    onValue(ref(db, 'server_status'), snap => {
        document.getElementById('offline-screen').style.display = snap.val() === "OFF" ? "flex" : "none";
    });

    // Auto-fill amount dari URL
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.has('amount')) document.getElementById('amount').value = urlParams.get('amount');

    window.handlePay = () => {
        const name = document.getElementById('buyer-name').value;
        const amt = document.getElementById('amount').value;
        if(!name || !amt) return alert("Isi data dulu!");

        const orderId = "RAYY" + Date.now();
        set(ref(db, 'transactions/' + orderId), {
            orderId, buyer: name, amount: "Rp " + parseInt(amt).toLocaleString(), status: "Pending", time: new Date().toLocaleString()
        }).then(() => {
            window.location.href = `https://app.pakasir.com/pay/rayy-store/${amt}?order_id=${orderId}&qris_only=1`;
        });
    };
</script>
</body>
</html>
