<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STATUS | RAYY STORE</title>
    <style>
        body { background: #05070a; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #0d121b; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 5px solid #00d2ff; text-align: left; }
        #offline-screen { display:none; position:fixed; inset:0; background:#000; z-index:10000; flex-direction:column; align-items:center; justify-content:center; }
    </style>
</head>
<body>
    <div id="offline-screen"><h1>SERVER OFF</h1></div>
    <h2>RIWAYAT TRANSAKSI</h2>
    <div id="list"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        const db = getDatabase(initializeApp({ databaseURL: "https://rayy-all-web-default-rtdb.asia-southeast1.firebasedatabase.app/" }));

        onValue(ref(db, 'server_status'), (snap) => {
            document.getElementById('offline-screen').style.display = snap.val() === "OFF" ? "flex" : "none";
        });

        onValue(ref(db, 'transactions'), (snap) => {
            const l = document.getElementById('list'); l.innerHTML = "";
            snap.forEach(c => {
                const d = c.val();
                l.innerHTML = `<div class="card"><b>${d.buyer}</b><br>${d.amount}<br>Status: ${d.status}</div>` + l.innerHTML;
            });
        });
    </script>
</body>
</html>
