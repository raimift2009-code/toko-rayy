<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAYY STORE - OFFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-main: #05070a; 
            --bg-card: #0d121b; 
            --accent-blue: #00d2ff; 
            --accent-glow: rgba(0, 210, 255, 0.4); 
            --text-white: #ffffff;
            --btn-orange: #ff9800;
            --btn-green: #2ecc71;
            --dev-red: #ff4757;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg-main); 
            color: var(--text-white); 
            margin: 0; 
            padding-bottom: 120px; 
            overflow-x: hidden;
        }

        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg-main);
            z-index: 100000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease-out, visibility 0.8s;
        }

        .logo-r-load {
            font-size: 150px;
            font-weight: 900;
            color: var(--accent-blue);
            text-shadow: 0 0 30px var(--accent-blue);
            animation: rSmoothPulse 1.8s infinite ease-in-out;
        }

        .loader-text {
            margin-top: 10px;
            letter-spacing: 5px;
            font-size: 0.8rem;
            color: var(--accent-blue);
            opacity: 0.6;
            font-weight: 600;
            text-transform: uppercase;
        }

        @keyframes rSmoothPulse {
            0% { transform: scale(0.85); opacity: 0.2; filter: blur(8px); }
            50% { transform: scale(1.1); opacity: 1; filter: blur(0px); text-shadow: 0 0 60px var(--accent-blue); }
            100% { transform: scale(0.85); opacity: 0.2; filter: blur(8px); }
        }

        #offline-screen { 
            display:none; 
            position:fixed; 
            inset:0; 
            background:#05070a; 
            z-index:10001; 
            flex-direction:column; 
            align-items:center; 
            justify-content:center; 
            text-align:center; 
            padding:20px; 
        }

        header { 
            padding: 50px 20px; 
            text-align: center; 
            font-weight: 900; 
            font-size: 2.5em; 
            letter-spacing: 6px; 
            text-transform: uppercase; 
            color: var(--accent-blue); 
            text-shadow: 0 0 20px var(--accent-glow); 
            animation: smoothPulse 2.5s infinite ease-in-out; 
        }

        @keyframes smoothPulse { 
            0%, 100% { transform: scale(1); filter: brightness(1); text-shadow: 0 0 15px var(--accent-glow); } 
            50% { transform: scale(1.05); filter: brightness(1.3); text-shadow: 0 0 35px var(--accent-blue); } 
        }

        .container { width: 90%; max-width: 500px; margin: 0 auto; }
        
        .category-btn { 
            width: 100%; 
            background: var(--bg-card); 
            border: 1px solid #1f2937; 
            padding: 20px; 
            border-radius: 18px; 
            color: var(--text-white); 
            font-weight: 700; 
            text-align: left; 
            margin-bottom: 12px; 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            transition: 0.4s; 
            border-left: 5px solid var(--accent-blue);
        }

        .category-btn:hover { 
            border-color: var(--accent-blue); 
            box-shadow: 0 0 15px var(--accent-glow); 
            transform: translateY(-3px); 
        }

        .product-list { 
            display: none; 
            background: #090e16; 
            border-radius: 18px; 
            padding: 20px; 
            margin-top: -5px; 
            margin-bottom: 25px; 
            border: 1px solid #1f2937; 
            animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        @keyframes slideDown { 
            from { opacity: 0; transform: translateY(-15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        .product-title { 
            font-size: 0.85rem; 
            color: var(--accent-blue); 
            margin: 15px 0 10px 0; 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 5px;
        }

        .option-item { 
            background: #ffffff; 
            color: #000000; 
            padding: 15px; 
            border-radius: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 0.9em; 
            border: 3px solid transparent; 
            transition: 0.3s;
            margin-bottom: 10px;
        }

        .selected { 
            border-color: var(--accent-blue); 
            background: #e0f7ff; 
            box-shadow: 0 0 15px var(--accent-glow); 
        }

        .btn-add { 
            width: 100%; 
            padding: 15px; 
            background: var(--btn-orange); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: 900; 
            cursor: pointer; 
            margin-top: 20px; 
            text-transform: uppercase;
        }

        .cart-float { 
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            background: var(--accent-blue); 
            width: 70px; 
            height: 70px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 2em; 
            z-index: 1000; 
            box-shadow: 0 10px 30px var(--accent-glow); 
        }

        .badge { 
            position: absolute; 
            top: -5px; 
            right: -5px; 
            background: #ff4757; 
            color: white; 
            font-size: 14px; 
            padding: 5px 10px; 
            border-radius: 50%; 
            font-weight: 900; 
        }

        .modal { 
            display: none; 
            position: fixed; 
            z-index: 9999; 
            inset: 0;
            background: rgba(0,0,0,0.9); 
            backdrop-filter: blur(8px);
        }

        .modal-content { 
            background: var(--bg-card); 
            margin: 10% auto; 
            padding: 30px; 
            width: 85%; 
            max-width: 400px; 
            border-radius: 30px; 
            border: 2px solid var(--accent-blue); 
        }
    </style>
</head>
<body onload="initLoader()">

<div id="loader">
    <div class="logo-r-load">R</div>
    <div class="loader-text">Rayy Store Official</div>
</div>

<div id="offline-screen">
    <div style="font-size: 80px; font-weight: 900; color: var(--accent-blue);">R</div>
    <h2 style="color:#ff4757; margin-top: 20px; font-weight: 900;">SERVER KATALOG TUTUP</h2>
</div>

<header>RAYY STORE</header>

<div class="container">
    <button class="category-btn" onclick="toggleMenu('menu_script')">
        <span>🤖 SCRIPT PREMIUM</span> <span>▼</span>
    </button>
    <div id="menu_script" class="product-list">
        <div class="product-title">VAIREZYNE SERIES</div>
        <div class="option-item" onclick="select(this, 'VAIREZYNE NO UP', 30000)">NO UP - Rp 30k</div>
        <div class="option-item" onclick="select(this, 'VAIREZYNE FREE UP', 50000)">FREE UP - Rp 50k</div>
        <div class="option-item" onclick="select(this, 'VAIREZYNE PARTNER', 95000)">PARTNER - Rp 95k</div>
        <button class="btn-add" onclick="addToCart('menu_script')">+ Keranjang</button>
    </div>

    <button class="category-btn" onclick="toggleMenu('menu_apk')">
        <span>💥 APK BUG EREN</span> <span>▼</span>
    </button>
    <div id="menu_apk" class="product-list">
        <div class="option-item" onclick="select(this, 'APK BUG 1H', 5000)">1 HARI - Rp 5k</div>
        <div class="option-item" onclick="select(this, 'APK BUG PERM', 60000)">PERMANEN - Rp 60k</div>
        <button class="btn-add" onclick="addToCart('menu_apk')">+ Keranjang</button>
    </div>
</div>

<div class="cart-float" onclick="openCart()">🛒<div id="cart-count" class="badge">0</div></div>

<div id="cartModal" class="modal">
    <div class="modal-content">
        <h3 style="text-align:center; color:var(--accent-blue); font-weight: 900;">LIST ORDER</h3>
        <div id="cartDisplay" style="max-height: 250px; overflow-y: auto; margin: 20px 0;"></div>
        <div style="display:flex; justify-content:space-between; font-weight:900;">
            <span>TOTAL:</span><span id="totalPrice" style="color:var(--accent-blue)">Rp 0</span>
        </div>
        <button onclick="payQR()" style="width:100%; padding:18px; background:var(--accent-blue); color:#000; border:none; border-radius:15px; font-weight:900; margin-top:20px; cursor:pointer;">💳 BAYAR QRIS</button>
        <button onclick="closeCart()" style="width:100%; background:none; color:#555; border:none; margin-top:15px; cursor:pointer;">TUTUP</button>
    </div>
</div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    
    const firebaseConfig = { databaseURL: "https://rayy-all-web-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.initLoader = function() {
        const loader = document.getElementById('loader');
        setTimeout(() => {
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.visibility = 'hidden';
                loader.style.display = 'none';
            }, 800);
        }, 2500);
    };

    onValue(ref(db, 'server_status'), (snapshot) => {
        const status = snapshot.val();
        const offline = document.getElementById('offline-screen');
        if (status === "OFF") {
            offline.style.display = "flex";
        } else {
            offline.style.display = "none";
        }
    });

    let cart = [];
    let selectedItems = {};

    window.toggleMenu = function(id) {
        const el = document.getElementById(id);
        const all = document.querySelectorAll('.product-list');
        all.forEach(m => { if(m.id !== id) m.style.display = 'none'; });
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    };

    window.select = function(el, name, price) {
        const parent = el.parentElement;
        parent.querySelectorAll('.option-item').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected');
        selectedItems[parent.id] = { name, price };
    };

    window.addToCart = function(id) {
        if (selectedItems[id]) {
            cart.push(selectedItems[id]);
            delete selectedItems[id];
            const container = document.getElementById(id);
            container.querySelectorAll('.option-item').forEach(i => i.classList.remove('selected'));
            updateUI();
        } else {
            alert("Pilih salah satu produk!");
        }
    };

    function updateUI() {
        document.getElementById('cart-count').innerText = cart.length;
        let total = 0;
        let html = "";
        cart.forEach((item, index) => {
            total += item.price;
            html += `
                <div style="display:flex; justify-content:space-between; padding:10px; background:#161d29; border-radius:10px; margin-bottom:10px;">
                    <span>${item.name}</span>
                    <span style="color:var(--accent-blue); font-weight:bold;">Rp ${item.price.toLocaleString()} 
                    <span onclick="removeItem(${index})" style="color:red; margin-left:10px; cursor:pointer;">×</span></span>
                </div>`;
        });
        document.getElementById('cartDisplay').innerHTML = html || "<center>Kosong</center>";
        document.getElementById('totalPrice').innerText = "Rp " + total.toLocaleString();
    }

    window.removeItem = function(index) {
        cart.splice(index, 1);
        updateUI();
    };

    window.openCart = function() { document.getElementById('cartModal').style.display = 'block'; };
    window.closeCart = function() { document.getElementById('cartModal').style.display = 'none'; };

    window.payQR = function() {
        const total = cart.reduce((a, b) => a + b.price, 0);
        if(total === 0) return alert("Keranjang kosong!");
        window.location.href = "index.html?amount=" + total;
    };
</script>
</body>
</html>
