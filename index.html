<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAYMENT RAYYSTORE</title>
    <style>
        :root { --accent: #00d2ff; --bg: #05070a; --card: #0d121b; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: #fff; overflow-x: hidden; }
        #loader { position:fixed; inset:0; background:var(--bg); z-index:9999; display:flex; align-items:center; justify-content:center; transition: 1s; }
        .logo-r-load { font-size: 80px; font-weight: 900; color: var(--accent); text-shadow: 0 0 30px var(--accent); animation: pulse 1.5s infinite; }
        .logo-main { font-size: 60px; font-weight: 900; color: var(--accent); text-shadow: 0 0 20px var(--accent); animation: pulse 2s infinite ease-in-out; margin-bottom: 10px; display: inline-block; }
        @keyframes pulse { 0%, 100% { opacity: 0.6; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.05); } }
        .notif { position: fixed; top: -120px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--accent); padding: 15px 30px; border-radius: 15px; z-index: 10000; transition: 0.6s; box-shadow: 0 10px 30px rgba(0,210,255,0.4); text-align: center; color: var(--accent); font-weight: bold; }
        .notif.show { top: 30px; }
        #offline-screen { display:none; position:fixed; inset:0; background:#05070a; z-index:9500; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; }
        .container { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: var(--card); border: 1px solid #1f2937; padding: 35px; border-radius: 28px; width: 100%; max-width: 380px; text-align: center; border-top: 4px solid var(--accent); }
        input { width: 100%; padding: 16px; margin-bottom: 12px; background: #161d29; border: 1px solid #1f2937; color: #fff; border-radius: 14px; outline: none; }
        .btn-pay { width: 100%; padding: 18px; background: var(--accent); color: #000; border: none; border-radius: 14px; font-weight: 800; cursor: pointer; transition: 0.3s; }
        .btn-cs { padding: 12px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 10px; }
        .wa { background: #25d366; }
    </style>
</head>
<body>

<div id="loader"><div class="logo-r-load">R</div></div>
<div id="notif-box" class="notif">Pesan</div>

<div id="offline-screen">
    <div class="logo-main">R</div>
    <h2 style="color:#e74c3c;">SERVER OFFLINE</h2>
    <p style="color:#8b949e;">Toko sedang tutup. Hubungi admin untuk info lebih lanjut.</p>
    <a href="https://wa.me/628131172093" class="btn-cs wa" style="width:200px">WhatsApp Admin</a>
</div>

<div class="container">
    <div class="card">
        <div class="logo-main">R</div>
        <h1 style="margin-bottom:20px;">RAYY <span style="color:var(--accent)">STORE</span></h1>
        <input type="text" id="buyer-name" placeholder="Username / ID Game">
        <input type="number" id="amount" placeholder="Nominal Topup (Rp)">
        <button class="btn-pay" onclick="handlePay()">BAYAR SEKARANG</button>
        <div style="margin-top:20px;">
            <a href="https://wa.me/628131172093" class="btn-cs wa">WhatsApp CS</a>
            <a href="Status.html" class="btn-cs" style="background:#333">🔍 CEK STATUS</a>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    const db = getDatabase(initializeApp({ databaseURL: "https://rayy-all-web-default-rtdb.asia-southeast1.firebasedatabase.app/" }));

    onValue(ref(db, 'server_status'), (snap) => {
        document.getElementById('offline-screen').style.display = snap.val() === "OFF" ? "flex" : "none";
    });

    window.handlePay = () => {
        const name = document.getElementById('buyer-name').value;
        const amount = document.getElementById('amount').value;
        if(!name || !amount) return alert("Isi data!");
        const orderId = "RAYY" + Date.now();
        set(ref(db, 'transactions/' + orderId), {
            orderId, buyer: name, amount: "Rp " + parseInt(amount).toLocaleString(), status: "Pending", time: new Date().toLocaleString()
        }).then(() => {
            window.location.href = `https://app.pakasir.com/pay/rayy-store/${amount}?order_id=${orderId}&qris_only=1`;
        });
    };

    window.addEventListener('load', () => { setTimeout(() => document.getElementById('loader').style.display = 'none', 1000); });
</script>
</body>
</html>
