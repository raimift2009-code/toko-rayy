<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAYY STORE - Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-main: #05070a; 
            --bg-card: #0d121b; 
            --accent-blue: #00d2ff; 
            --accent-glow: rgba(0, 210, 255, 0.4); 
            --text-white: #ffffff; 
            --btn-orange: #ff9800;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-main); color: var(--text-white); padding-bottom: 120px; overflow-x: hidden; }
        
        header { 
            padding: 50px 20px; text-align: center; font-weight: 900; font-size: 2.5em; 
            letter-spacing: 6px; text-transform: uppercase; color: var(--accent-blue); 
            text-shadow: 0 0 15px var(--accent-glow); 
            animation: smoothPulse 2.5s infinite ease-in-out; 
        }
        @keyframes smoothPulse { 
            0%, 100% { transform: scale(1); filter: brightness(1); text-shadow: 0 0 15px var(--accent-glow); } 
            50% { transform: scale(1.05); filter: brightness(1.3); text-shadow: 0 0 35px var(--accent-blue); } 
        }

        .container { width: 90%; max-width: 500px; margin: 0 auto; }
        
        /* STYLE OFFLINE FULL SCREEN */
        #offline-screen { 
            display:none; position:fixed; inset:0; background:#000; z-index:10001; 
            flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; 
        }
        .logo-off { 
            font-size: 100px; font-weight: 900; color: #ff4757; 
            text-shadow: 0 0 30px #ff4757; animation: smoothPulse 1.5s infinite; 
        }

        .category-btn { 
            width: 100%; background: var(--bg-card); border: 1px solid #1f2937; padding: 20px; 
            border-radius: 18px; color: var(--text-white); font-weight: 700; text-align: left; 
            margin-bottom: 12px; cursor: pointer; display: flex; justify-content: space-between; 
            align-items: center; transition: 0.4s; 
        }
        .category-btn:hover { border-color: var(--accent-blue); box-shadow: 0 0 15px var(--accent-glow); transform: translateY(-3px); }
        .category-btn span.icon { color: var(--accent-blue); font-size: 1.2em; }
        
        .product-list { 
            display: none; background: #090e16; border-radius: 18px; padding: 20px; 
            margin-top: -5px; margin-bottom: 25px; border: 1px solid #1f2937; 
            animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
        
        .product-title { font-size: 0.85em; color: var(--accent-blue); margin: 15px 0 10px 0; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }
        .option-list { display: flex; flex-direction: column; gap: 10px; }
        .option-item { 
            background: #fff; color: #000; padding: 15px; border-radius: 12px; 
            display: flex; justify-content: space-between; align-items: center; 
            cursor: pointer; font-weight: 700; transition: 0.3s; 
        }
        .circle { width: 22px; height: 22px; border: 2px solid #ccc; border-radius: 50%; }
        .selected { border: 3px solid var(--accent-blue); background: #e0f7ff; box-shadow: 0 0 10px var(--accent-glow); }
        .selected .circle { background: var(--accent-blue); border-color: var(--accent-blue); }
        
        .btn-add { 
            width: 100%; padding: 15px; background: var(--btn-orange); color: white; 
            border: none; border-radius: 12px; font-weight: 900; cursor: pointer; 
            margin-top: 20px; font-size: 1em; text-transform: uppercase; 
        }
        
        .cart-float { 
            position: fixed; bottom: 30px; right: 30px; background: var(--accent-blue); 
            width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; font-size: 2em; cursor: pointer; color: black; z-index: 1000; 
            box-shadow: 0 10px 30px var(--accent-glow); transition: 0.3s; 
        }
        .cart-float:hover { transform: scale(1.1); }
        .badge { position: absolute; top: -5px; right: -5px; background: red; color: white; font-size: 14px; padding: 5px 10px; border-radius: 50%; font-weight: bold; border: 2px solid var(--bg-main); }
        
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); }
        .modal-content { background: var(--bg-card); margin: 10% auto; padding: 30px; width: 85%; max-width: 400px; border-radius: 30px; border: 2px solid var(--accent-blue); }
        .btn-pay { width: 100%; padding: 18px; background: var(--accent-blue); color: #000; border: none; border-radius: 15px; font-weight: 900; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div id="offline-screen">
    <div class="logo-off">R</div>
    <h1 style="color:#ff4757; font-size: 2.5em;">SERVER OFFLINE</h1>
    <p style="color:#8b949e; margin-top: 10px;">Kembali lagi nanti ya Bosku!</p>
</div>

<header>RAYY STORE</header>

<div class="container">
    <button class="category-btn" onclick="toggleMenu('menu_script')"><span>🤖 SCRIPT PREMIUM</span> <span class="icon">▼</span></button>
    <div id="menu_script" class="product-list">
        <div class="product-title">VAIREZYNE SERIES</div>
        <div class="option-list" id="list_vairezyne">
            <div class="option-item" onclick="select(this, 'VAIREZYNE NO UP', 30000)">NO UP <div class="circle"></div></div>
            <div class="option-item" onclick="select(this, 'VAIREZYNE FREE UP', 50000)">FREE UP <div class="circle"></div></div>
        </div>
        <div class="product-title">ALICE SERIES</div>
        <div class="option-list" id="list_alice">
            <div class="option-item" onclick="select(this, 'ALICE V16', 80000)">ALICE V16 <div class="circle"></div></div>
        </div>
        <button class="btn-add" onclick="addToCart('list_vairezyne', 'list_alice')">+ Keranjang</button>
    </div>

    <button class="category-btn" onclick="toggleMenu('menu_panel')"><span>⚡ PANEL VVIP</span> <span class="icon">▼</span></button>
    <div id="menu_panel" class="product-list">
        <div class="option-list" id="list_panel">
            <div class="option-item" onclick="select(this, 'PANEL 1GB', 2000)">1GB <div class="circle"></div></div>
            <div class="option-item" onclick="select(this, 'PANEL UNLI', 20000)">UNLIMITED <div class="circle"></div></div>
        </div>
        <button class="btn-add" onclick="addToCart('list_panel')">+ Keranjang</button>
    </div>
</div>

<div class="cart-float" onclick="openCart()">🛒<div id="cart-count" class="badge">0</div></div>

<div id="cartModal" class="modal">
    <div class="modal-content">
        <h2 style="text-align:center; color:var(--accent-blue); margin-bottom: 20px;">LIST ORDER</h2>
        <div id="cartDisplay" style="max-height: 250px; overflow-y: auto;"></div>
        <div style="display:flex; justify-content:space-between; font-weight:bold; border-top: 1px solid #333; padding-top: 15px; margin-top: 15px;">
            <span>TOTAL:</span><span id="totalPrice" style="color:var(--accent-blue)">Rp 0</span>
        </div>
        <button class="btn-pay" onclick="payNow()">BAYAR SEKARANG</button>
        <button onclick="closeCart()" style="width:100%; background:none; color:#888; border:none; margin-top:15px; cursor:pointer">Batal</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<script>
    firebase.initializeApp({ databaseURL: "https://rayy-all-web-default-rtdb.asia-southeast1.firebasedatabase.app/" });
    const db = firebase.database();

    db.ref('server_status').on('value', snap => {
        document.getElementById('offline-screen').style.display = snap.val() === "OFF" ? "flex" : "none";
    });

    let cart = [];
    let selectedItems = {};

    function toggleMenu(id) {
        const el = document.getElementById(id);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }

    function select(el, name, price) {
        el.parentElement.querySelectorAll('.option-item').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected');
        selectedItems[el.parentElement.id] = { name, price };
    }

    function addToCart(...ids) {
        let added = false;
        ids.forEach(id => {
            if (selectedItems[id]) {
                cart.push(selectedItems[id]);
                delete selectedItems[id];
                document.getElementById(id).querySelectorAll('.option-item').forEach(i => i.classList.remove('selected'));
                added = true;
            }
        });
        if(added) updateUI();
    }

    function updateUI() {
        document.getElementById('cart-count').innerText = cart.length;
        let total = 0; let html = "";
        cart.forEach((item, idx) => {
            total += item.price;
            html += `<div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                        <span>${item.name}</span>
                        <span>Rp ${item.price.toLocaleString()}</span>
                    </div>`;
        });
        document.getElementById('cartDisplay').innerHTML = html || "<center>Keranjang Kosong</center>";
        document.getElementById('totalPrice').innerText = "Rp " + total.toLocaleString();
    }

    function openCart() { document.getElementById('cartModal').style.display = 'block'; }
    function closeCart() { document.getElementById('cartModal').style.display = 'none'; }
    function payNow() {
        const total = cart.reduce((a, b) => a + b.price, 0);
        if(total > 0) window.location.href = "index.html?amount=" + total;
    }
</script>
</body>
</html>
