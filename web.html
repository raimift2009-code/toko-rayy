<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAYY STORE - Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-main: #05070a; --bg-card: #0d121b; --accent-blue: #00d2ff; --accent-glow: rgba(0, 210, 255, 0.4); --text-white: #ffffff; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-main); color: var(--text-white); margin: 0; padding-bottom: 120px; overflow-x: hidden; }
        
        header { padding: 40px 20px; text-align: center; font-weight: 900; font-size: 2.2em; letter-spacing: 5px; text-transform: uppercase; color: var(--accent-blue); text-shadow: 0 0 15px var(--accent-glow); animation: smoothPulse 2s infinite ease-in-out; }
        @keyframes smoothPulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 30px var(--accent-blue); } }

        .container { width: 90%; max-width: 500px; margin: 0 auto; }
        .category-btn { width: 100%; background: var(--bg-card); border: 1px solid #1f2937; padding: 18px; border-radius: 15px; color: var(--text-white); font-weight: 700; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; transition: 0.3s; }
        .category-btn:hover { border-color: var(--accent-blue); box-shadow: 0 0 15px var(--accent-glow); }
        .product-list { display: none; background: #090e16; border-radius: 15px; padding: 15px; margin-bottom: 20px; border: 1px solid #1f2937; animation: slideIn 0.4s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .option-item { background: white; color: black; padding: 14px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .selected { border: 3px solid var(--accent-blue); background: #e0f7ff; }
        .btn-add { width: 100%; padding: 12px; background: #ff9800; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        #offline-screen { display:none; position:fixed; inset:0; background:#000; z-index:10001; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
        .logo-off { font-size: 80px; font-weight: 900; color: #ff4757; text-shadow: 0 0 20px #ff4757; animation: smoothPulse 1.5s infinite; }
        
        .cart-float { position: fixed; bottom: 25px; right: 25px; background: var(--accent-blue); width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8em; cursor: pointer; color: black; z-index: 1000; box-shadow: 0 5px 20px var(--accent-glow); }
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); }
        .modal-content { background: var(--bg-card); margin: 15% auto; padding: 25px; width: 85%; border-radius: 25px; border: 1px solid var(--accent-blue); }
    </style>
</head>
<body>
<div id="offline-screen"><div class="logo-off">R</div><h2 style="color:#ff4757">SERVER OFFLINE</h2><p style="color:#8b949e">Toko Tutup Sementara</p></div>
<header>RAYY STORE</header>
<div class="container">
    <button class="category-btn" onclick="toggleMenu('m1')">🤖 SCRIPT PREMIUM <span>▼</span></button>
    <div id="m1" class="product-list">
        <div id="l1">
            <div class="option-item" onclick="select(this, 'VAIREZYNE NO UP', 30000)">NO UP - 30k</div>
            <div class="option-item" onclick="select(this, 'ALICE V16', 80000)">ALICE V16 - 80k</div>
        </div>
        <button class="btn-add" onclick="addToCart('l1')">+ Keranjang</button>
    </div>
    <button class="category-btn" onclick="toggleMenu('m2')">⚡ PANEL VVIP <span>▼</span></button>
    <div id="m2" class="product-list">
        <div id="l2"><div class="option-item" onclick="select(this, 'PANEL UNLI', 20000)">UNLIMITED - 20k</div></div>
        <button class="btn-add" onclick="addToCart('l2')">+ Keranjang</button>
    </div>
</div>
<div class="cart-float" onclick="openCart()">🛒<div id="cart-count" style="position:absolute; top:0; right:0; background:red; color:white; font-size:12px; padding:3px 7px; border-radius:50%">0</div></div>
<div id="cartModal" class="modal"><div class="modal-content"><h3 style="color:var(--accent-blue)">LIST ORDER</h3><div id="cartDisplay"></div><button onclick="payQR()" style="width:100%; padding:15px; background:var(--accent-blue); border-radius:10px; margin-top:10px; font-weight:bold;">BAYAR SEKARANG</button><button onclick="closeCart()" style="width:100%; background:none; color:grey; border:none; margin-top:10px;">TUTUP</button></div></div>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<script>
    firebase.initializeApp({ databaseURL: "https://rayy-all-web-default-rtdb.asia-southeast1.firebasedatabase.app/" });
    const db = firebase.database();
    db.ref('server_status').on('value', s => document.getElementById('offline-screen').style.display = s.val()==="OFF" ? "flex" : "none");
    let cart = [], sel = {};
    function toggleMenu(id) { document.getElementById(id).style.display = document.getElementById(id).style.display==='block' ? 'none' : 'block'; }
    function select(el, n, p) { el.parentElement.querySelectorAll('.option-item').forEach(i=>i.classList.remove('selected')); el.classList.add('selected'); sel[el.parentElement.id] = {n, p}; }
    function addToCart(id) { if(sel[id]) { cart.push(sel[id]); updateUI(); } }
    function updateUI() { document.getElementById('cart-count').innerText = cart.length; let h = ""; cart.forEach(i=> h+=`<div>${i.n} - Rp ${i.p}</div>`); document.getElementById('cartDisplay').innerHTML = h; }
    function openCart() { document.getElementById('cartModal').style.display = 'block'; }
    function closeCart() { document.getElementById('cartModal').style.display = 'none'; }
    function payQR() { let t = cart.reduce((a,b)=>a+b.p, 0); window.location.href=`index.html?amount=${t}`; }
</script>
</body>
</html>
