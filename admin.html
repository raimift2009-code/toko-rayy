<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN PANEL | RAYYSTORE</title>
    <style>
        :root { --accent: #00d2ff; --bg: #05070a; --card: #0d121b; --green: #2ecc71; --yellow: #f1c40f; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: #fff; padding: 20px; overflow-x: hidden; }

        /* LOADER */
        #loader { position:fixed; inset:0; background:var(--bg); z-index:10000; display:flex; align-items:center; justify-content:center; transition: 0.8s; }
        .logo-r { font-size: 80px; font-weight: 900; color: var(--accent); text-shadow: 0 0 30px var(--accent); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(0.9); opacity: 0.6; } 50% { transform: scale(1.1); opacity: 1; } }

        /* NOTIF */
        #notif { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #000; padding: 15px 30px; border-radius: 15px; font-weight: bold; z-index: 10001; transition: 0.5s; box-shadow: 0 10px 30px rgba(0,210,255,0.4); }
        #notif.show { top: 20px; }

        /* LOGIN */
        #login-admin { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-card { background: var(--card); padding: 40px; border-radius: 25px; border: 1px solid #1f2937; width: 90%; max-width: 380px; text-align: center; border-top: 5px solid var(--accent); }
        input { width: 100%; padding: 14px; margin: 10px 0; background: #161d29; border: 1px solid #1f2937; color: #fff; border-radius: 12px; outline: none; }
        .btn-login { width: 100%; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* OFFLINE LOCK */
        #offline-screen { display:none; position:fixed; inset:0; background:#000; z-index:11000; flex-direction:column; align-items:center; justify-content:center; text-align:center; }

        /* CONTENT */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #1f2937; padding-bottom: 15px; }
        .trx-card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 15px; border-left: 6px solid var(--accent); position: relative; transition: 0.3s; }
        .trx-card.success { border-left-color: var(--green); }
        .trx-id { font-size: 0.8rem; color: var(--accent); font-weight: bold; margin-bottom: 5px; }
        .trx-amt { font-size: 1.4rem; font-weight: 800; margin: 5px 0; }
        .trx-user { font-size: 0.9rem; color: #8b949e; }
        .status-badge { position: absolute; top: 20px; right: 20px; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; }
        .btn-acc { width: 100%; padding: 12px; background: var(--green); border: none; border-radius: 10px; font-weight: bold; margin-top: 15px; cursor: pointer; color: #000; }
    </style>
</head>
<body>

<div id="loader"><div class="logo-r">R</div></div>
<div id="notif">Pesan</div>

<div id="offline-screen">
    <h1 style="color:red; font-size: 3em;">LOCKED</h1>
    <p>Server sedang OFFLINE. Aktifkan di Dev Panel.</p>
</div>

<div id="login-admin">
    <div class="login-card">
        <h2 style="margin-bottom:20px; color: var(--accent);">ADMIN LOGIN</h2>
        <input type="text" id="adm-user" placeholder="Username Admin">
        <input type="password" id="adm-pass" placeholder="Password (085794)">
        <button class="btn-login" onclick="handleLogin()">MASUK KE PANEL</button>
    </div>
</div>

<div id="main-content" style="display:none;">
    <div class="header">
        <div>
            <h2 style="letter-spacing: 2px;">RIWAYAT <span style="color:var(--accent)">TRANSAKSI</span></h2>
            <p id="total-count" style="font-size: 0.8rem; color: #8b949e;">Total: 0 Pesanan</p>
        </div>
        <button onclick="location.reload()" style="background:#161d29; color:#fff; border:1px solid #333; padding:10px 15px; border-radius:10px; cursor:pointer;">Refresh</button>
    </div>

    <div id="trx-list">Memuat data transaksi...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    
    const db = getDatabase(initializeApp({ databaseURL: "https://rayy-all-web-default-rtdb.asia-southeast1.firebasedatabase.app/" }));

    window.addEventListener('load', () => { setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 1000); });

    function showNotif(t) {
        const n = document.getElementById('notif'); n.innerText = t; n.classList.add('show');
        setTimeout(() => n.classList.remove('show'), 3000);
    }

    // SERVER LOCK
    onValue(ref(db, 'server_status'), s => {
        document.getElementById('offline-screen').style.display = s.val() === "OFF" ? "flex" : "none";
    });

    window.handleLogin = () => {
        const u = document.getElementById('adm-user').value;
        const p = document.getElementById('adm-pass').value;
        if(u === "admin_rayy" && p === "085794") {
            document.getElementById('login-admin').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            showNotif("✅ Login Admin Berhasil!");
        } else { showNotif("❌ Akses Ditolak!"); }
    };

    onValue(ref(db, 'transactions'), (snap) => {
        const container = document.getElementById('trx-list');
        container.innerHTML = "";
        let count = 0;
        if(!snap.exists()) { container.innerHTML = "Belum ada transaksi."; return; }
        
        snap.forEach(child => {
            count++;
            const d = child.val();
            const isDone = d.status === "Sukses";
            container.innerHTML = `
                <div class="trx-card ${isDone ? 'success' : ''}">
                    <div class="trx-id">${d.orderId}</div>
                    <div class="trx-amt">${d.amount}</div>
                    <div class="trx-user">Buyer: ${d.buyer} | ${d.time}</div>
                    <div class="status-badge" style="color:${isDone ? 'var(--green)' : 'var(--yellow)'}">${isDone ? '✓ SUKSES' : '⏳ PENDING'}</div>
                    ${!isDone ? `<button class="btn-acc" onclick="acc('${d.orderId}')">KONFIRMASI PEMBAYARAN</button>` : ''}
                </div>
            ` + container.innerHTML;
        });
        document.getElementById('total-count').innerText = "Total: " + count + " Pesanan";
    });

    window.acc = (id) => {
        update(ref(db, 'transactions/' + id), { status: "Sukses" }).then(() => showNotif("✅ Transaksi Berhasil Dikonfirmasi!"));
    };
</script>
</body>
</html>
